<!DOCTYPE html>
<html lang=\"en\">
<head>
  <meta charset=\"UTF-8\" />
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />
  <title>Trump Letter to Biden - Concept 1</title>
  <link rel=\"stylesheet\" href=\"styles.css\" />
  <script defer src=\"script.js\"></script>
</head>
<body>
  <header class=\"site-header\">
    <h1>Trump Letter to Biden</h1>
    <p class=\"tagline\">Concept 1: a simple message exchange</p>
  </header>
  <main class=\"container\">
    <section class=\"panel\">
      <h2>Compose Letter</h2>
      <textarea id=\"letter\" placeholder=\"Write your letter here...\"></textarea>
      <button id=\"previewBtn\">Preview</button>
    </section>
    <section class=\"panel\" aria-label=\"Preview area\">
      <h2>Preview</h2>
      <div id=\"preview\" class=\"preview-box\"></div>
    </section>
  </main>
</body>
</html>
